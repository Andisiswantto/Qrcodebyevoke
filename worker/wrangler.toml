name            = "qr-code-generator-api"
main            = "index.js"
compatibility_date = "2024-01-01"

# ── Workers Free Tier is sufficient for this project ──────────────
# For production, consider Workers Paid for higher request limits.

[vars]
# ⚠️  These are placeholder values.
# Set actual secrets using:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_KEY
#   wrangler secret put SUPABASE_ANON_KEY
#
# DO NOT commit real keys to source control.
SUPABASE_URL        = "YOUR_SUPABASE_PROJECT_URL"
SUPABASE_SERVICE_KEY = "YOUR_SUPABASE_SERVICE_ROLE_KEY"
SUPABASE_ANON_KEY   = "YOUR_SUPABASE_ANON_KEY"

# ── Routes (optional — configure after deploying Pages) ───────────
# [[routes]]
# pattern = "your-domain.com/api/*"
# zone_name = "your-domain.com"

# ── Observability ─────────────────────────────────────────────────
[observability]
enabled = true
